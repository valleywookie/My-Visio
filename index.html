<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simplified Visio Mimic</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f3f2f1; }
        .toolbar { background: white; padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #ccc; z-index: 10; }
        #canvas { flex-grow: 1; position: relative; overflow: auto; background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 20px 20px; }
        .shape { position: absolute; cursor: move; display: flex; align-items: center; justify-content: center; text-align: center; padding: 5px; box-sizing: border-box; font-size: 13px; font-weight: 600; border: 2px solid; user-select: none; background: white; min-width: 100px; min-height: 50px; }
        .process { border-color: #0078d4; color: #0078d4; }
        .start { border-color: #107c10; color: #107c10; border-radius: 50px; }
        .decision { border-color: #6264a7; color: #6264a7; transform: rotate(0deg); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); width: 100px; height: 100px; }
        .lane { position: absolute; border: 1px solid #d13438; width: 95%; height: 200px; z-index: -1; padding: 10px; pointer-events: none; }
        .lane-label { color: #d13438; font-weight: bold; pointer-events: auto; cursor: pointer; }
        button { padding: 8px 15px; cursor: pointer; background: white; border: 1px solid #0078d4; color: #0078d4; font-weight: bold; border-radius: 4px; }
        button:hover { background: #0078d4; color: white; }
    </style>
</head>
<body>

<div class="toolbar">
    <button onclick="addShape('start')">+ Start/End</button>
    <button onclick="addShape('process')">+ Process</button>
    <button onclick="addShape('decision')">+ Decision</button>
    <button onclick="addLane()">+ Add Swimlane</button>
    <button style="margin-left:auto; background: #0078d4; color: white;" onclick="window.print()">Save as PDF</button>
</div>

<div id="canvas" id="canvas"></div>

<script>
    let laneCount = 0;

    function addShape(type) {
        const shape = document.createElement('div');
        shape.className = `shape ${type}`;
        shape.innerText = type === 'decision' ? 'Check' : 'New Step';
        shape.style.left = '100px';
        shape.style.top = '100px';
        
        // Make it draggable
        dragElement(shape);
        
        // Double click to rename

            let newText = prompt("Enter text:", this.innerText);
            if(newText) this.innerText = newText;
        };

            e.preventDefault();
