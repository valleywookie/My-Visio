<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.7/joint.css" />
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .toolbar { background: #333; padding: 10px; display: flex; gap: 10px; }
        #canvas { flex-grow: 1; background-color: #f4f4f4; cursor: crosshair; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-process { background: #0078d4; color: white; }
        .btn-decision { background: #6264a7; color: white; }
        .btn-data { background: #28a745; color: white; }
        .btn-pdf { background: #dc3545; color: white; margin-left: auto; }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn-process" onclick="addShape('Rect')">+ Process</button>
    <button class="btn-decision" onclick="addShape('Diamond')">+ Decision</button>
    <button class="btn-data" onclick="addShape('Cylinder')">+ Data</button>
    <button class="btn-pdf" onclick="exportPDF()">Download PDF</button>
</div>

<div id="canvas"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.1/backbone-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.7/joint.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    const graph = new joint.dia.Graph();
    const paper = new joint.dia.Paper({
        el: document.getElementById('canvas'),
        model: graph,
        width: '100%',
        height: '100%',
        gridSize: 10,
        drawGrid: true,
        background: { color: '#f8f9fa' },
        defaultLink: new joint.shapes.standard.Link(),
        validateConnection: function(cellViewS, magnetS, cellViewT, magnetT) {
            return cellViewS !== cellViewT; // Prevent connecting a shape to itself
        },
        snapLinks: { radius: 20 },
        interactive: { labelMove: true }
    });

    function addShape(type) {
        let shape;
        if (type === 'Rect') {
            shape = new joint.shapes.standard.Rectangle();
            shape.attr({ body: { fill: '#0078d4', stroke: 'none', rx: 2, ry: 2 }, label: { text: 'Process', fill: 'white' }});
        } else if (type === 'Diamond') {
            shape = new joint.shapes.standard.Polygon();
            shape.attr({ body: { points: '50,0 100,50 50,100 0,50', fill: '#6264a7', stroke: 'none' }, label: { text: 'Decision', fill: 'white' }});
        } else {
            shape = new joint.shapes.standard.Cylinder();
            shape.attr({ body: { fill: '#28a745', stroke: 'none' }, label: { text: 'Data', fill: 'white' }});
        }
        
        shape.position(100, 100);
        shape.resize(120, 60);
        shape.addTo(graph);
    }

    // Double-click a shape to delete it
    paper.on('cell:pointerdblclick', function(cellView) {
        cellView.model.remove();
    });

    function exportPDF() {
        const element = document.getElementById('canvas');
        html2pdf().from(element).set({ margin: 10, filename: 'flowchart.pdf' }).save();
    }
</script>
</body>
</html>
