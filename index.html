<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.7/joint.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .toolbar { background: #2b2b2b; padding: 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
        #canvas { flex-grow: 1; background-color: #ffffff; cursor: crosshair; }
        button { padding: 10px 16px; cursor: pointer; border: none; border-radius: 4px; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-process { background: #0078d4; color: white; }
        .btn-decision { background: #6264a7; color: white; }
        .btn-data { background: #28a745; color: white; }
        .btn-pdf { background: #d83b01; color: white; margin-left: auto; }
        .instruction { color: #ccc; font-size: 12px; margin-left: 10px; }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn-process" onclick="addShape('Rect')">+ Process</button>
    <button class="btn-decision" onclick="addShape('Diamond')">+ Decision</button>
    <button class="btn-data" onclick="addShape('Cylinder')">+ Data</button>
    <span class="instruction">Double-click shape to edit text | Drag from center to connect</span>
    <button class="btn-pdf" onclick="exportPDF()">Export PDF</button>
</div>

<div id="canvas"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.1/backbone-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.7/joint.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    const graph = new joint.dia.Graph();
    const paper = new joint.dia.Paper({
        el: document.getElementById('canvas'),
        model: graph,
        width: '100%',
        height: '100%',
        gridSize: 10,
        drawGrid: true,
        background: { color: '#f0f0f0' },
        defaultLink: new joint.shapes.standard.Link(),
        validateConnection: (cellViewS, magnetS, cellViewT, magnetT) => cellViewS !== cellViewT,
        snapLinks: { radius: 25 },
        linkPinning: false, // Links must be connected to a shape
        markAvailable: true
    });

    function addShape(type) {
        let shape;
        if (type === 'Rect') {
            shape = new joint.shapes.standard.Rectangle();
            shape.attr({ body: { fill: '#0078d4', stroke: '#005a9e', strokeWidth: 2, rx: 2, ry: 2 }, label: { text: 'New Process', fill: 'white', fontWeight: 'bold' }});
        } else if (type === 'Diamond') {
            shape = new joint.shapes.standard.Polygon();
            // Diamond points
            shape.attr({ body: { refPoints: '0,10 10,0 20,10 10,20', fill: '#6264a7', stroke: '#48497e', strokeWidth: 2 }, label: { text: 'Decision?', fill: 'white', fontWeight: 'bold' }});
        } else {
            shape = new joint.shapes.standard.Cylinder();
            shape.attr({ body: { fill: '#28a745', stroke: '#1e7e34', strokeWidth: 2 }, label: { text: 'Database', fill: 'white', fontWeight: 'bold' }});
        }
        
        shape.position(150, 150);
        shape.resize(140, 70);
        shape.addTo(graph);
    }

    // INTERACTION: Double-click to Edit Text
    paper.on('cell:pointerdblclick', function(cellView) {
        const currentText = cellView.model.attr('label/text');
        const newText = prompt("Enter new text for this shape:", currentText);
        if (newText !== null) {
            cellView.model.attr('label/text', newText);
        }
    });

    // Right-click to delete a shape
    paper.on('cell:contextmenu', function(cellView) {
        if(confirm("Delete this item?")) {
            cellView.model.remove();
        }
    });

    function exportPDF() {
        const element = document.getElementById('canvas');
        const opt = {
            margin: 0.5,
            filename: 'my-visio-flow.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>
</body>
</html>
