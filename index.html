<!DOCTYPE html>
<html>
<head>
    <title>Visio Mimic Pro</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f3f2f1; display: flex; flex-direction: column; height: 100vh; }
        .toolbar { background: white; padding: 10px; border-bottom: 1px solid #ccc; display: flex; gap: 10px; }
        #canvas { flex-grow: 1; position: relative; background: white; overflow: hidden; background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 20px 20px; }
        .shape { 
            position: absolute; width: 140px; height: 70px; 
            border: 2px solid #0078d4; background: white; color: #333;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: move; text-align: center; z-index: 10;
        }
        .start { border-radius: 50px; border-color: green; }
        .lane { position: absolute; width: 95%; height: 200px; border: 2px dashed red; z-index: 1; pointer-events: none; }
        .lane-label { pointer-events: auto; color: red; font-weight: bold; cursor: pointer; padding: 5px; }
        button { padding: 8px 12px; cursor: pointer; background: white; border: 1px solid #0078d4; color: #0078d4; font-weight: bold; }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="toolbar">
    <button onclick="addShape('start', 'Start/End')">+ Start/End</button>
    <button onclick="addShape('', 'Process')">+ Process</button>
    <button onclick="addLane()">+ Add Swimlane</button>
    <button onclick="window.print()" style="margin-left:auto;">Save PDF</button>
</div>

<div id="canvas">
    <svg id="svg-canvas"></svg>
</div>

<script>
    let laneY = 20;
    
    function addShape(type, txt) {
        const el = document.createElement('div');
        el.className = 'shape ' + type;
        el.innerText = txt;
        el.style.left = '100px';
        el.style.top = '100px';
        
        // Simple Drag
        el.onmousedown = function(e) {
            let shiftX = e.clientX - el.getBoundingClientRect().left;
            let shiftY = e.clientY - el.getBoundingClientRect().top;
            document.onmousemove = function(e) {
                el.style.left = e.pageX - shiftX + 'px';
                el.style.top = e.pageY - shiftY + 'px';
            };
            document.onmouseup = function() { document.onmousemove = null; };
        };
        
        el.ondblclick = function() {
            let n = prompt("Text:", this.innerText);
            if(n) this.innerText = n;
        };

        document.getElementById('canvas').appendChild(el);
    }

    function addLane() {
        const lane = document.createElement('div');
        lane.className = 'lane';
        lane.style.top = laneY + 'px';
        lane.style.left = '20px';
        lane.innerHTML = `<div class="lane-label" onclick="this.innerText=prompt('Name:',this.innerText)">DEPARTMENT</div>`;
        document.getElementById('canvas').appendChild(lane);
        laneY += 220;
    }
</script>
</body>
</html>
