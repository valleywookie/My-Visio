<!DOCTYPE html>
<html>
<head>
    <title>Visio Mimic Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f3f2f1; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .toolbar { background: white; padding: 12px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #ccc; z-index: 100; }
        #canvas { position: relative; flex-grow: 1; background: white; overflow: auto; background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 20px 20px; }
        .shape { 
            position: absolute; width: 130px; height: 65px; 
            border: 2px solid #0078d4; background: #fff; color: #333;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; cursor: move; user-select: none;
            text-align: center; font-size: 13px; z-index: 10;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .start { border-radius: 50px; border-color: #107c10; }
        .decision { width: 80px; height: 80px; transform: rotate(45deg); border-color: #6264a7; }
        .decision span { transform: rotate(-45deg); }
        .lane { position: absolute; width: 95%; height: 220px; border: 2px dashed #d13438; z-index: 1; padding: 10px; pointer-events: none; }
        .lane-label { color: #d13438; font-weight: bold; pointer-events: auto; cursor: pointer; background: white; padding: 2px 5px; }
        button { padding: 8px 15px; cursor: pointer; border: 1px solid #0078d4; background: white; color: #0078d4; font-weight: bold; border-radius: 4px; }
        button:hover { background: #0078d4; color: white; }
        svg { position: absolute; top: 0; left: 0; width: 3000px; height: 3000px; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="toolbar">
    <button onclick="addShape('start', 'Start/End')">+ Start/End</button>
    <button onclick="addShape('', 'Process')">+ Process</button>
    <button onclick="addShape('decision', '<span>Decision?</span>')">+ Decision</button>
    <button onclick="addLane()">+ Add Swimlane</button>
    <span style="font-size: 11px; color: #666; margin-left: 10px;"><b>Connect:</b> Click Shape 1, then Shape 2. | Double-click text to rename.</span>
    <button onclick="window.print()" style="margin-left:auto; background: #0078d4; color:white;">Save PDF</button>
</div>

<div id="canvas">
    <svg id="svg-lines"></svg>
</div>

<script>
    let laneY = 20;
    let connections = [];
    let firstSelected = null;

    function addShape(cssClass, html) {
        const div = document.createElement('div');
        div.className = 'shape ' + cssClass;
        div.innerHTML = html;
        div.style.left = '100px';
        div.style.top = '100px';
        
        // Double-click to rename
        div.ondblclick = function(e) {
            e.stopPropagation();
            const val = prompt("Enter text:", this.innerText);
            if (val) this.innerHTML = cssClass.includes('decision') ? `<span>${val}</span>` : val;
        };

        // Click logic for connecting
        div.onclick = function() {
            if (!firstSelected) {
                firstSelected = this;
                this.style.outline = "3px solid #ffb900";
            } else {
                if (firstSelected !== this) {
                    connections.push({ from: firstSelected, to: this });
                    drawLines();
                }
                firstSelected.style.outline = "none";
                firstSelected = null;
            }
        };

        makeDraggable(div);
        document.getElementById('canvas').appendChild(div);
    }

    function addLane() {
        const lane = document.createElement('div');
        lane.className = 'lane';
        lane.style.top = laneY + 'px';
        lane.style.left = '20px';
        lane.innerHTML = `<span class="lane-label" onclick="this.innerText=prompt('Name:',this.innerText)">DEPARTMENT NAME</span>`;
        document.getElementById('canvas').appendChild(lane);
        laneY += 240;
    }

    function drawLines() {
        const svg = document.getElementById('svg-lines');
        svg.innerHTML = '';
        connections.forEach(conn => {
            const r1 = conn.from.getBoundingClientRect();
            const r2 = conn.to.getBoundingClientRect();
            const canvasR = document.getElementById('canvas').getBoundingClientRect();

            const x1 = r1.left + r1.width / 2 - canvasR.left;
            const y1 = r1.top + r1.height / 2 - canvasR.top;
            const x2 = r2.left + r2.width / 2 - canvasR.left;
            const y2 = r2.top + r2.height / 2 - canvasR.top;

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // Orthogonal path: Moves horizontally then vertically
            const d = `M ${x1} ${y1} L ${x1} ${(y1+y2)/2} L ${x2} ${(y1+y2)/2} L ${x2} ${y2}`;
