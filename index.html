<!DOCTYPE html>

    <title>My Visio Pro - Stable Build</title>

        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f3f2f1; overflow: hidden; }
        .toolbar { background: white; padding: 12px; display: flex; gap: 10px; border-bottom: 1px solid #ccc; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #canvas { flex-grow: 1; position: relative; background: white; overflow: auto; background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 20px 20px; }
        
        .shape { position: absolute; width: 140px; height: 70px; background: white; color: #333; display: flex; align-items: center; justify-content: center; font-weight: 600; cursor: move; user-select: none; text-align: center; font-size: 13px; z-index: 10; border: 3.5px solid; }
        .process { border-color: #0078d4; }
        .start { border-color: #107c10; border-radius: 50px; }
        .decision { width: 90px; height: 90px; border-color: #6264a7; transform: rotate(45deg); }
        .decision span { transform: rotate(-45deg); display: block; width: 100%; }

        .data { border: none; background: transparent; }
        .data-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .lane-label { color: #d13438; font-weight: bold; pointer-events: auto; cursor: pointer; background: white; padding: 2px 8px; font-size: 14px; }

        .port { position: absolute; width: 14px; height: 14px; background: #0078d4; border-radius: 50%; opacity: 0; cursor: crosshair; z-index: 20; border: 2px solid white; }
        .shape:hover .port { opacity: 1; }
