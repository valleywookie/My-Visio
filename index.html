<!DOCTYPE html>
<html>
<head>
    <title>Visio Test Page</title>
    <style>
        body { font-family: sans-serif; padding: 50px; background: #f0f0f0; }
        .box { 
            width: 200px; height: 100px; 
            border: 3px solid #0078d4; background: white; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; margin-bottom: 20px;
            box-shadow: 5px 5px 0px #ccc;
        }
        .start { border-color: green; border-radius: 50px; }
        .lane { border: 2px dashed red; padding: 20px; width: 500px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>If you can see this, the website is working!</h1>
    <p>Below are the basic Visio shapes:</p>

    <div class="lane">
        <div class="box start">START SHAPE</div>
        <div class="box">PROCESS STEP</div>
    </div>

    <div class="lane">
        <div class="box">DEPARTMENT 2 STEP</div>
    </div>

</body>
</html>
