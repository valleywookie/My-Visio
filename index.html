<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.7/joint.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .toolbar { background: #ffffff; padding: 12px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #d1d1d1; z-index: 1000; }
        #canvas { flex-grow: 1; background-color: #fdfdfd; }
        button { padding: 8px 16px; cursor: pointer; border: 1px solid #0078d4; border-radius: 2px; font-size: 13px; background: white; color: #0078d4; font-weight: 600; }
        button:hover { background: #0078d4; color: white; }
        .btn-lane { background: #fff1f0; border-color: #d13438; color: #d13438; }
        .btn-pdf { background: #0078d4; color: white; margin-left: auto; }
        .joint-port { opacity: 0; transition: opacity 0.2s; }
        .joint-cell:hover .joint-port { opacity: 1; }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn-lane" onclick="addLane()">+ Add Swimlane</button>
    <button onclick="addShape('rect')">Process</button>
    <button onclick="addShape('ellipse')">Start/End</button>
    <button onclick="addShape('diamond')">Decision</button>
    <button onclick="addShape('data')">Data / Input</button>
    <button class="btn-pdf" onclick="exportPDF()">Export PDF</button>
</div>

<div id="canvas"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.1/backbone-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.7/joint.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    const graph = new joint.dia.Graph();
    const paper = new joint.dia.Paper({
        el: document.getElementById('canvas'),
        model: graph,
        width: '100%',
        height: '100%',
        gridSize: 10,
        drawGrid: { name: 'dot', color: '#e0e0e0' },
        defaultLink: () => new joint.shapes.standard.Link({
            router: { 
                name: 'manhattan', 
                args: { 
                    step: 10,
                    padding: 25,
                    perpendicular: true // Forces the line to be 90 degrees as it exits
                } 
            },
            connector: { name: 'jumpover' },
            attrs: { line: { stroke: '#333', strokeWidth: 2, targetMarker: { 'type': 'path', 'd': 'M 8 -4 0 0 8 4 Z', fill: '#333' } } }
        }),
        validateConnection: (vs, ms, vt, mt) => ms && mt && vs !== vt,
        snapLinks: { radius: 25 },
        markAvailable: true,
        interactive: (cellView) => !cellView.model.get('isLane')
    });

    // Ports are now explicitly labeled by their position
    const ports = {
        groups: { 
            'pts': { 
                position: 'ellipse', 
                attrs: { circle: { r: 5, magnet: true, fill: '#0078d4', stroke: '#fff', strokeWidth: 2 } } 
            } 
        },
        items: [
            { group: 'pts', id: 'top', position: 'top' }, 
            { group: 'pts', id: 'bottom', position: 'bottom' }, 
            { group: 'pts', id: 'left', position: 'left' }, 
            { group: 'pts', id: 'right', position: 'right' }
        ]
    };

        const laneCount = graph.getCells().filter(c => c.get('isLane')).length;
        lane.resize(window.innerWidth - 60, 220);
